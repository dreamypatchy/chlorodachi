# github really doesn't have proper webhook system so this file was unfortunately made by claude

name: Telegram notify

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            push)
              TEXT=$(jq -r '
                .repository as $r
                | (.ref | sub("^refs/(heads|tags)/"; "")) as $name
                | (if (.ref | startswith("refs/tags/")) then "tag" else "branch" end) as $kind
                | (.commits | length) as $n
                | [
                    (if .created then
                      "[\($r.full_name)] \($kind) \($name) (\($r.html_url)/tree/\($name)) created"
                    else empty end),
                    (if .deleted then
                      "[\($r.full_name)] \($kind) \($name) deleted"
                    else empty end),
                    (if $n > 0 then
                      "[\($r.full_name):\($name)] \($n) new commit\(if $n == 1 then "" else "s" end)",
                      (.commits | reverse | .[]
                        | "[\(.id[0:7]) (\(.url))] \(.message | split("\n")[0]) - \(.author.username // .author.name)")
                    else empty end)
                  ] | join("\n")
              ' "$GITHUB_EVENT_PATH") ;;

            pull_request)
              TEXT=$(jq -r '
                (if .action == "closed" and .pull_request.merged then "merged" else .action end) as $a
                | "[\(.repository.full_name)] Pull request \($a): #\(.pull_request.number) \(.pull_request.title) by \(.sender.login) (\(.pull_request.html_url))"
              ' "$GITHUB_EVENT_PATH") ;;

            issues)
              TEXT=$(jq -r '
                "[\(.repository.full_name)] Issue \(.action): #\(.issue.number) \(.issue.title) by \(.sender.login) (\(.issue.html_url))"
              ' "$GITHUB_EVENT_PATH") ;;

            release)
              TEXT=$(jq -r '
                "[\(.repository.full_name)] Release published: \(.release.name // .release.tag_name) by \(.sender.login) (\(.release.html_url))"
              ' "$GITHUB_EVENT_PATH") ;;
          esac

          [ -z "$TEXT" ] && exit 0
          TEXT="${TEXT:0:4000}"

          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true"
